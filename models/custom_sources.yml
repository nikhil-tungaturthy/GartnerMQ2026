version: 2

sources:
  - name: salesforce
    description: Salesforce CRM data replicated from the sandbox environment.
    schema: salesforce_sandbox_ts_census
    tables:
      - name: lead
        description: Salesforce lead records, including active, converted, and deleted records; downstream models retain only active, unconverted leads.
        columns:
          - name: id
            description: Salesforce lead identifier and primary key for the source table.
            data_tests:
              - unique:
                  description: Confirms that each Salesforce lead identifier is represented once in the replicated source.
              - not_null:
                  description: Confirms that every replicated Salesforce lead has an identifier.
      - name: opportunityHistory
        description: Historical field-value changes recorded against Salesforce opportunities.
      - name: account
        description: Salesforce account records representing organizations or households.
      - name: user
        description: Salesforce user records for people with access to the CRM.
      - name: fivetran_formula_model
        description: Fivetran-managed metadata table supporting replicated Salesforce formula fields.

  - name: shopify
    description: Shopify commerce data replicated by Fivetran.
    tables:
      - name: ORDER
        description: Shopify order records at one row per order, including Fivetran-deleted records that downstream models filter out.
        quoting:
          identifier: true
        columns:
          - name: id
            description: Shopify's internal order identifier and primary key for the source table.
            data_tests:
              - unique:
                  description: Confirms that each Shopify order identifier is represented once in the replicated source.
              - not_null:
                  description: Confirms that every replicated Shopify order has an identifier.
      - name: customer
        description: Shopify customer records at one row per customer, including Fivetran-deleted records that downstream models filter out.
        columns:
          - name: id
            description: Shopify's internal customer identifier and primary key for the source table.
            data_tests:
              - unique:
                  description: Confirms that each Shopify customer identifier is represented once in the replicated source.
              - not_null:
                  description: Confirms that every replicated Shopify customer has an identifier.

  - name: google_analytics
    description: Google Analytics event logs.
    database: snowflake_demo_01
    tables:
      - name: log
        description: Raw Google Analytics event logs replicated to Snowflake.
